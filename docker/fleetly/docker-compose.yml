# MessageLoop × mlbridge —— fleetly 部署栈（2026-10-02 新平台形态，F1.15 dogfooding）
#
# 平台 = 新 fleetly（N0+F1.x，ADR-0033/0034 面）。与归档仓 v0.1 形态差异：
# - 密钥 = Project Secret 文件注入（/run/secrets/<name>），env-from-secret 经
#   sh -c 包装（v0.1 的 `fleetly env set` 不存在）；
# - mlbridge.yaml（config-file-only 键）经 Secret 文件投递并 --config 指认：
#   平台 Config 挂载面（config_refs）的运行期材料化未落地（挂账），Secret
#   文件面是等价投递通道（值非敏感，走 Secret 是 interim 形态，README §5）；
# - 服务互访 = compose 服务名（ADR-0034 网络别名=进程名）：redis/messageloop/
#   mlbridge 按名互访；
# - mlbridge → torchwood = 跨 Project 网络引用（F1.8 peer 声明/批准后挂靠）：
#   __TW_PROJECT_ID__ 占位由部署脚本按实际项目 ID 渲染（渲染后文件不入库）；
# - 域名 = 平台 Route（ml 9080 http / ml-grpc 9090 h2c / ml-api 9091 h2c），
#   TLS 在平台边缘终结（LE staging CA，*.dev.fleetly.run 通配解析已在位）。

volumes:
  redis_data:

services:
  # ==================== redis（AOF：streams 历史 + broker epoch） ====================
  redis:
    image: redis:7-alpine
    # AOF 必开：无持久化重启 = 历史清零 + epoch 重建（旧客户端偏移失去续读意义）。
    command: ["redis-server", "--appendonly", "yes"]
    networks: [default]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  # ==================== messageloop（WS 9080 / 客户端 gRPC 9090 / Server API 9091） ====================
  messageloop:
    image: ghcr.io/messageloopio/messageloop:sha-b009c71
    # 平台 command 覆盖 ENTRYPOINT → 写全命令；--config 指认 Secret 文件投递的
    # mlbridge.yaml（proxy 接线是 config-file-only），鉴权 token 同源文件导出。
    command:
      - sh
      - -c
      - |
        set -eu
        export MESSAGELOOP_SERVER_API_AUTH_TOKENS="$(cat /run/secrets/ml-api-tokens)"
        exec /usr/local/bin/messageloop --config /run/secrets/mlbridge-yaml
    networks: [default]
    secrets: [ml-api-tokens, mlbridge-yaml]
    ports:
      - "9080"
      - "9090"
      - "9091"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      start_period: 15s
    environment:
      # —— 鉴权：经 mlbridge 代理认证（Torchwood 凭证），无本地命名空间 ——
      MESSAGELOOP_SERVER_REQUIRE_AUTH: "true"
      # —— 监听地址（--config 取代镜像默认配置基线，addr 类键必须给全）——
      # 8080 绑回环：/health、/metrics 不对外；非回环绑定必须同时配
      # MESSAGELOOP_SERVER_HTTP_AUTH_TOKEN（fail-closed）。
      MESSAGELOOP_SERVER_HTTP_ADDR: "127.0.0.1:8080"
      MESSAGELOOP_SERVER_API_ADDR: "0.0.0.0:9091"
      MESSAGELOOP_TRANSPORT_WEBSOCKET_ADDR: "0.0.0.0:9080"
      MESSAGELOOP_TRANSPORT_WEBSOCKET_PATH: "/ws"
      MESSAGELOOP_TRANSPORT_GRPC_ADDR: "0.0.0.0:9090"
      # —— 传输行为（镜像默认配置基线值）——
      MESSAGELOOP_TRANSPORT_WEBSOCKET_COMPRESSION: "true"
      MESSAGELOOP_SERVER_HEARTBEAT_IDLE_TIMEOUT: "300s"
      MESSAGELOOP_SERVER_RPC_TIMEOUT: "30s"
      # —— broker：栈内 redis（别名 = 服务名，ADR-0034）——
      MESSAGELOOP_BROKER_TYPE: "redis"
      MESSAGELOOP_BROKER_REDIS_ADDR: "redis:6379"
      MESSAGELOOP_BROKER_REDIS_STREAM_APPROXIMATE: "true"
      MESSAGELOOP_BROKER_REDIS_STREAM_MAX_LENGTH: "10000"
      # —— WebSocket 跨域（token 鉴权下 Origin 不是授权边界）——
      MESSAGELOOP_TRANSPORT_WEBSOCKET_ALLOW_ALL_ORIGINS: "true"

  # ==================== mlbridge（Torchwood ⇄ MessageLoop 桥，栈内私有） ====================
  mlbridge:
    image: ghcr.io/messageloopio/mlbridge:sha-39d254d
    command:
      - sh
      - -c
      - |
        set -eu
        export MLBRIDGE_TORCHWOOD_PROJECTS="$(cat /run/secrets/ml-tw-projects)"
        export MLBRIDGE_MESSAGELOOP_API_TOKEN="$(cat /run/secrets/ml-api-tokens)"
        exec /usr/local/bin/mlbridge
    networks:
      - default
      # 跨 Project 引用（F1.8 ADR-0013 附录 A.2）：目标 = torchwood 项目的
      # default 网（peer declare/approve 后挂靠；__TW_PROJECT_ID__ 部署时渲染）。
      # 挂靠侧别名不传播，目标侧 server 的别名（进程名）可解析。
      - "project:__TW_PROJECT_ID__/default"
    secrets: [ml-tw-projects, ml-api-tokens]
    healthcheck:
      # TCP 存活（busybox nc）：无 HTTP 端口；配置类故障 = 进程退出 = 探针失败。
      test: ["CMD", "nc", "-z", "127.0.0.1", "9070"]
    environment:
      MLBRIDGE_LISTEN: "0.0.0.0:9070"
      # torchwood 网关：跨 Project 挂靠后按目标项目网别名（进程名）回访。
      MLBRIDGE_TORCHWOOD_BASE_URL: "http://server:9080"
      # admin 面：栈内 messageloop（别名 = 服务名）。
      MLBRIDGE_MESSAGELOOP_API_ADDR: "messageloop:9091"
      # 会话索引：与 broker 共用栈内 redis（键前缀 mlb:*）。
      MLBRIDGE_REDIS_ADDR: "redis:6379"
      # 写穿：send RPC 先落 TW 文档再经 Server API 扇出。
      MLBRIDGE_WRITE_THROUGH_ENABLED: "true"
      MLBRIDGE_WRITE_THROUGH_DATABASE: "messageloop"
      MLBRIDGE_WRITE_THROUGH_COLLECTION: "messages"
      MLBRIDGE_WRITE_THROUGH_CHANNELS: "[\"**\"]"
