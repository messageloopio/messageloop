name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      # Integration tests (pkg/redisbroker, cluster redis) default to
      # 127.0.0.1:6379 with no password and skip when Redis is absent.
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      # 工具链唯一来源：mise.toml（go / buf / node / golangci-lint 全钉版本）
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.5

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # buf 版本由 mise.toml 钉住（原 Taskfile init 与本文件内联的双处钉版已收敛）。
      - name: Check generated protocol code is up to date
        run: |
          mise run generate-protocol
          git diff --exit-code

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test shared module
        working-directory: shared
        run: go test ./...

      - name: Test Go SDK module
        working-directory: sdks/go
        run: go test ./...

      # Chatroom e2e needs a running server; CI only builds it.
      - name: Build chatroom example
        working-directory: _examples/chatroom
        run: go build ./...

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  ts-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/ts
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.5

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('sdks/ts/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npx jest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.5

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: golangci-lint
        run: mise run lint
