name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Redis 缺失时集成测试必须红而不是静默 skip 假绿（requireClusterRedis
    # 等三处 helper 经 MESSAGELOOP_TEST_REDIS_REQUIRED 把 skip 升级为失败）。
    env:
      MESSAGELOOP_TEST_REDIS_REQUIRED: "1"
    services:
      # Integration tests (pkg/redisbroker, cluster redis, sdks/go e2e)
      # default to 127.0.0.1:6379 with no password; locally they skip when
      # Redis is absent, here the env above turns absence into a failure.
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      # 工具链唯一来源：mise.toml（go / buf / node / golangci-lint 全钉版本）
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.5

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # buf 版本由 mise.toml 钉住（原 Taskfile init 与本文件内联的双处钉版已收敛）。
      - name: Check generated protocol code is up to date
        run: |
          mise run generate-protocol
          git diff --exit-code

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test shared module
        working-directory: shared
        run: go test ./...

      - name: Test Go SDK module
        working-directory: sdks/go
        run: go test ./...

      # Chatroom e2e needs a running server; CI only builds it.
      - name: Build chatroom example
        working-directory: _examples/chatroom
        run: go build ./...

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  ts-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/ts
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.5

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('sdks/ts/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npx jest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.5

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: golangci-lint
        run: mise run lint

  # 飞书通知（共用 .github/actions/feishu-notify）：CI 只在失败时推送——
  # 成功是常态噪音；fork PR 拿不到 secrets，action 内部自动跳过。
  notify:
    name: Feishu notify
    needs: [build-and-test, ts-sdk, lint]
    if: ${{ !cancelled() && failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/feishu-notify
        with:
          status: failure
          detail: build-and-test=${{ needs.build-and-test.result }} ts-sdk=${{ needs.ts-sdk.result }} lint=${{ needs.lint.result }}
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
