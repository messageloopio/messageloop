server:
  http:
    addr: "127.0.0.1:8080"   # Admin HTTP server exposing /health and /metrics
  grpc_admin:
    addr: "127.0.0.1:9091"   # Server-side gRPC admin API; keep this on a private interface
    auth_token: "change-me"  # Required bearer token for admin API (mandatory unless allow_insecure: true)
    # allow_insecure: true   # Explicitly run the admin API WITHOUT authentication (NOT recommended)
    # tls:
    #   cert_file: "./certs/admin.crt"
    #   key_file: "./certs/admin.key"
    # capabilities:          # Admin capability bits (PR-KA-A4). Omitted =
    #                        # every closed bit except pattern.global.
    #   - history.read
    #   - presence.read
    #   - channels.list
    #   - session.act
    #   - user.fanout
    #   - subscribe.any
    #   - presence.large_snapshot
    #   - survey.bypass_gate
    # Explicitly empty [] locks the admin data plane (no history/presence/
    # channels reads, no session/user operations). Unknown names fail Validate.
  heartbeat:
    idle_timeout: "300s"  # Close idle client connections after this duration.
                          # "" or parse failure = 300s; "0s" = never kick for idle.
                          # Non-zero values must be >= 1s.
    # ping_interval: "0s" # Server-initiated ping interval. 0/"" = off (default).
    #                     # When > 0 the server pings each client and disconnects
    #                     # with 3511 if no inbound frame arrives within ping_timeout.
    #                     # WARNING: requires SDKs that answer pings with a Pong,
    #                     # otherwise old clients are disconnected.
    # ping_timeout: "3s"  # How long to wait for any inbound frame after a server
    #                     # ping. Defaults to ping_interval when left empty.
    #                     # Non-zero values must be >= 1s; "0s" is rejected.
  rpc_timeout: "30s"      # Default timeout for proxied RPC requests
  limits:
    max_connections_per_user: 0       # 0 = unlimited
    max_subscriptions_per_client: 0   # 0 = unlimited
    max_publishes_per_second: 0       # 0 = unlimited
    max_message_size: 65536           # bytes, 0 = default
  # The single authorization table (PR-KA-A4). Pattern language is the
  # subscription key language: "*" = one segment, "**" = only the final
  # segment; the literal prefix must not be empty. deny_all denies every
  # action on the pattern; a nil allow list does not constrain the action;
  # an empty list denies it; "*" allows any authenticated user.
  # Effects overlay in table order: generic rules first, specific rules last.
  # Unset = subscribe/publish open, survey off, history/presence on.
  authorizer:
    default:                    # Base Effects for every channel
      history: true
      presence: true
      recover: true
      survey: false             # client survey off by default (KD-6)
      # history_size: 0         # 0 = broker global (memory 256 / redis stream_max_length)
      # history_ttl: ""         # empty = broker global
      # max_survey_subscribers: 256
      # max_survey_timeout: "5s"
      # presence_snapshot_limit: 256
      # legacy_presence_channel: false
    rules:
      - pattern: "chat.public.*"
        allow_subscribe: ["*"]
        allow_publish: ["alice", "bob"]
      - pattern: "chat.private.*"
        deny_all: true
      # - pattern: "game.tick.**"   # game ticks: forced transient
      #   transient_only: true
      #   presence: false
      # - pattern: "csurvey.**"     # open client survey on a prefix
      #   allow_survey: ["*"]
      #   survey: true
  # presence:
  #   # server.presence.cluster_emit is REMOVED (PR-KA-B2): occupancy always
  #   # crosses nodes over the live bus on the exact channel. Do not write the
  #   # key; config.Validate rejects it.

transport:
  websocket:
    addr: ":9080"
    path: "/ws"
    allow_all_origins: true  # Set to true for development to allow cross-origin requests
    # allowed_origins:       # Whitelist of allowed origins (used when allow_all_origins is false)
    #   - "https://example.com"
    #   - "https://app.example.com"
    compression: true   # Enable permessage-deflate
    # write_timeout: "10s"
    # tls:
    #   cert_file: "./certs/server.crt"
    #   key_file: "./certs/server.key"
  grpc:
    addr: ":9090"  # Client-facing gRPC streaming listener
    # write_timeout: "10s"
    # tls:
    #   cert_file: "./certs/server.crt"
    #   key_file: "./certs/server.key"
  # quic:                         # Optional UDP/QUIC client listener (disabled when addr is empty)
  #   addr: ":4433"
  #   insecure: true              # Dev only: ephemeral self-signed cert. Production must set tls.
  #   # write_timeout: "10s"
  #   # read_timeout: "60s"
  #   # tls:
  #   #   cert_file: "./certs/server.crt"
  #   #   key_file: "./certs/server.key"

broker:
  type: redis  # Use "memory" for a single-node in-process broker
  redis:
    addr: 127.0.0.1:6379
    password: ""
    db: 10
    # pool_size: 10
    # min_idle_conns: 5
    # max_retries: 3
    # dial_timeout: "5s"
    # read_timeout: "3s"
    # write_timeout: "3s"
    # stream_max_length: 10000
    stream_approximate: true  # Only approximate trimming is implemented; false is rejected by Validate
    # history_ttl: "24h"

cluster:
  enabled: false       # Set to true to enable the Redis-backed distributed control plane.
  node_id: node-a      # Must be unique per logical node in the cluster.
  backend: redis       # Current distributed control-plane backend.
                       # In practice this should be paired with broker.type=redis.

proxy:
  - name: example-grpc
    endpoint: 127.0.0.1:10091
    timeout: 30s
    grpc:
      insecure: true
    routes:
      - channel: "*"
        method: "*"
