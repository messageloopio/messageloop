syntax = "proto3";

// buf:lint:ignore PACKAGE_DIRECTORY_MATCH
package messageloop.proxy.v2;

import "shared/v2/errors.proto";
import "shared/v2/types.proto";

option go_package = "github.com/messageloopio/messageloop/shared/genproto/proxy/v2;proxyv2pb";

service ProxyService {
  // RPC 调用
  rpc RPC(RPCRequest) returns (RPCResponse);
  // 认证
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  // 订阅权限校验
  rpc SubscribeAcl(SubscribeAclRequest) returns (SubscribeAclResponse);
  // 发布权限校验
  rpc PublishAcl(PublishAclRequest) returns (PublishAclResponse);
  // 生命周期钩子
  rpc OnConnected(OnConnectedRequest) returns (OnConnectedResponse);
  rpc OnSubscribed(OnSubscribedRequest) returns (OnSubscribedResponse);
  rpc OnUnsubscribed(OnUnsubscribedRequest) returns (OnUnsubscribedResponse);
  rpc OnDisconnected(OnDisconnectedRequest) returns (OnDisconnectedResponse);
  // Server API Key 校验（api_auth 指派的 proxy 后端实现）
  rpc AuthenticateAPIKey(AuthenticateAPIKeyRequest) returns (AuthenticateAPIKeyResponse);
}

// --- RPC ---

message RPCRequest {
  string id = 1;
  string channel = 2;
  string method = 3;
  messageloop.shared.v2.Payload payload = 4;
  messageloop.shared.v2.Metadata metadata = 5;
  // Identity fields for per-user authorization on the proxy backend.
  string user_id = 6;
  string session_id = 7;
  string client_id = 8;
}

message RPCResponse {
  string id = 1;
  messageloop.shared.v2.Payload payload = 2;
  messageloop.shared.v2.Metadata metadata = 3;
  messageloop.shared.v2.Error error = 4;
}

// --- Authenticate ---

message AuthenticateRequest {
  string client_id = 1;
  string token = 2;
  string client_type = 3;
  string session_id = 4;
  string remote_addr = 5;
}

message AuthenticateResponse {
  messageloop.shared.v2.Error error = 1;
  UserInfo user_info = 2;
}

message UserInfo {
  string id = 1;
  string username = 2;
  string token = 3;
  string client_type = 4;
  string client_id = 5;
  // Namespace scopes the session to a multi-tenant namespace: every
  // client-visible channel must live under it ("ns:topic"). Empty means the
  // server falls back to its static server.namespace.
  string namespace = 6;
}

// --- SubscribeAcl ---

message SubscribeAclRequest {
  string channel = 1;
  string token = 2;
  string user_id = 3;
  string session_id = 4;
}

message SubscribeAclResponse {
  messageloop.shared.v2.Error error = 1;
}

// --- PublishAcl ---

message PublishAclRequest {
  string channel = 1;
  string token = 2;
  string user_id = 3;
  string session_id = 4;
}

message PublishAclResponse {
  messageloop.shared.v2.Error error = 1;
}

// --- 生命周期钩子 ---

message OnConnectedRequest {
  string session_id = 1;
  string username = 2;
}

message OnConnectedResponse {}

message OnSubscribedRequest {
  string session_id = 1;
  string channel = 2;
  string username = 3;
}

message OnSubscribedResponse {}

message OnUnsubscribedRequest {
  string session_id = 1;
  string channel = 2;
  string username = 3;
}

message OnUnsubscribedResponse {}

message OnDisconnectedRequest {
  string session_id = 1;
  string username = 2;
}
message OnDisconnectedResponse {}

// --- AuthenticateAPIKey ---

message AuthenticateAPIKeyRequest {
  string api_key = 1;       // 调用方出示的完整 Key 明文（由 proxy 后端校验）
  string remote_addr = 2;   // 审计用
}

// APIKeyInfo 是 proxy 后端裁定的 Server API 调用方身份。key_id 必须是后端 Key 的
// 唯一 ID（非显示名：调用方 allow 列表按 "key:<id>" 匹配 principal，显示名
// 不唯一会串权限——设计 D26）。namespaces 空列表 = 拒绝一切（fail-closed）；
// capabilities 是能力位名称闭集，空 = 零能力；max_age_seconds 是相对时长
// （本验证结果至多再用多久，规避两系统时钟偏斜——D14/G8），0 = 用调用方配置 TTL。
message APIKeyInfo {
  string key_id = 1;
  repeated string namespaces = 2;
  repeated string capabilities = 3;
  int64 max_age_seconds = 4;
}

message AuthenticateAPIKeyResponse {
  messageloop.shared.v2.Error error = 1;
  APIKeyInfo identity = 2;
}
