syntax = "proto3";

package messageloop.client.v2;

import "shared/v2/errors.proto";
import "shared/v2/types.proto";

option go_package = "github.com/messageloopio/messageloop/shared/genproto/client/v2;clientv2";

service MessageLoopService {
  // 核心双向数据流
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc MessageLoop(stream InboundMessage) returns (stream OutboundMessage);
}

// 客户端 -> 服务端
message InboundMessage {
  string id = 1;
  uint64 time = 2;
  oneof envelope {
    Connect connect = 3;
    Subscribe subscribe = 4;
    Unsubscribe unsubscribe = 5;
    Publish publish = 6;
    RpcRequest rpc_request = 7;
    SubRefresh sub_refresh = 8;
    SurveyRequest survey_request = 9;
    SurveyReply survey_reply = 10;
    Ping ping = 11;
    Pong pong = 12;
    PresenceQuery presence_query = 13;
  }
}

// 服务端 -> 客户端
message OutboundMessage {
  string id = 1;
  uint64 time = 2;
  oneof envelope {
    messageloop.shared.v2.Error error = 3;
    Connected connected = 4;
    SubscribeAck subscribe_ack = 5;
    UnsubscribeAck unsubscribe_ack = 6;
    PublishAck publish_ack = 7;
    Publication publication = 8;
    RecoverComplete recover_complete = 9;
    RpcReply rpc_reply = 10;
    SubRefreshAck sub_refresh_ack = 11;
    SurveyRequest survey_request = 12;
    SurveyReply survey_reply = 13;
    SurveyResult survey_result = 14;
    PresenceSnapshot presence = 15;
    PresenceEvent presence_event = 16;
    Ping ping = 17;
    Pong pong = 18;
  }
}

// --- 消息类型定义 ---

message Connect {
  string client_id = 1;
  string client_type = 2;
  string token = 3;
  string version = 4;
  repeated Subscription subscriptions = 5;
  string session_id = 6; // 上次会话 ID，为空表示新连接
  repeated string caps = 7;
}

message Connected {
  string session_id = 1;
  repeated Subscription subscriptions = 2; // 必须带回 ephemeral
  bool resumed = 3; // 是否成功恢复会话
  string stream_epoch = 4; // broker 实例标识，用于防止重启后 offset 混淆
  repeated string accepted_caps = 5;
}

// --- 恢复相关 ---

message Subscription {
  string channel = 1;
  bool ephemeral = 2;
  string token = 3;
  bool recover = 4; // 是否需要恢复离线消息
  messageloop.shared.v2.Position cursor = 5; // 恢复起点提示；unset 表示无提示
  bool fresh = 6; // 显式从头；禁止用 cursor.offset==0 表示从头
}

enum RecoverState {
  RECOVER_STATE_UNSPECIFIED = 0;
  RECOVER_STATE_NONE = 1;
  RECOVER_STATE_PENDING = 2;
  RECOVER_STATE_SKIPPED = 3;
  RECOVER_STATE_FAILED = 4;
}

message Subscribe {
  repeated Subscription subscriptions = 1;
}

message SubscribeAck {
  repeated Subscription subscriptions = 1;
  RecoverState recover = 2; // 批量里任一频道 pending 则 PENDING
  string stream_epoch = 3;
  repeated PresenceSnapshot presence = 4; // 仅精确且非 ephemeral
  messageloop.shared.v2.Error error = 5; // 仅 recover=FAILED 时
}

message Unsubscribe {
  repeated Subscription subscriptions = 1;
}

message UnsubscribeAck {
  repeated Subscription subscriptions = 1;
}

message RecoverComplete {
  string channel = 1;
  messageloop.shared.v2.Position position = 2;
  bool truncated = 3;
  bool gap = 4;
  messageloop.shared.v2.GapReason gap_reason = 5;
  messageloop.shared.v2.Error error = 6; // SKIPPED/FAILED 细节
}

// --- 发布相关 ---

message Publish {
  string channel = 1;
  messageloop.shared.v2.Payload payload = 2;
  messageloop.shared.v2.Metadata metadata = 3;
  string token = 4;
  bool transient = 5;
  string idempotency_key = 6;
}

message PublishAck {
  string id = 1; // 消息 ID，便于追踪
  messageloop.shared.v2.Position position = 2; // transient / 无历史 → offset 缺省
}

message Message {
  string id = 1;
  string channel = 2;
  messageloop.shared.v2.Position position = 3;
  messageloop.shared.v2.Payload payload = 4;
  messageloop.shared.v2.Metadata metadata = 5;
  bool replay = 6; // 恢复流回放
}

message Publication {
  repeated Message messages = 1;
}

// --- RPC 相关 ---

message RpcRequest {
  string channel = 1;
  string method = 2;
  messageloop.shared.v2.Payload payload = 3;
  messageloop.shared.v2.Metadata metadata = 4;
}

message RpcReply {
  string request_id = 1;
  messageloop.shared.v2.Payload payload = 2;
  messageloop.shared.v2.Metadata metadata = 3;
  messageloop.shared.v2.Error error = 4;
}

// --- Survey 相关 ---

message SubRefresh {
  repeated string channels = 1;
}

message SubRefreshAck {}

message SurveyRequest {
  string request_id = 1;
  messageloop.shared.v2.Payload payload = 2;
  messageloop.shared.v2.Metadata metadata = 3;
  string channel = 4;
  int32 timeout_ms = 5;
}

message SurveyReply {
  string request_id = 1;
  messageloop.shared.v2.Payload payload = 2;
  messageloop.shared.v2.Metadata metadata = 3;
  messageloop.shared.v2.Error error = 4;
}

// 客户端 Survey 汇总。与 server.v2.SurveyResult 同名不同包。
message SurveyResult {
  string request_id = 1;
  string channel = 2;
  repeated SurveyAnswer answers = 3;
  messageloop.shared.v2.Error error = 4;
}

message SurveyAnswer {
  string session_id = 1;
  messageloop.shared.v2.Payload payload = 2;
  messageloop.shared.v2.Metadata metadata = 3;
  messageloop.shared.v2.Error error = 4;
}

// --- Presence 相关 ---

message PresenceQuery {
  string channel = 1; // 精确频道
}

message PresenceInfo {
  string session_id = 1;
  string user_id = 2;
  string client_id = 3; // Connect.client_id（设备/端），不是 session
  int64 connected_at = 4;
}

message PresenceSnapshot {
  string channel = 1;
  repeated PresenceInfo clients = 2;
  bool truncated = 3;
  int32 occupancy = 4;
}

message PresenceEvent {
  string channel = 1;     // 始终是精确频道
  string action = 2;      // "join" | "leave"
  PresenceInfo info = 3;
  uint64 gen = 4;         // OccupancyGen
}

// --- 心跳 ---

message Ping {}

message Pong {}
