syntax = "proto3";

package messageloop.client.v1;

import "shared/v1/errors.proto";
import "shared/v1/types.proto";

option go_package = "github.com/messageloopio/messageloop/shared/genproto/client/v1;clientpb";

service MessageLoopService {
  // 核心双向数据流
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc MessageLoop(stream InboundMessage) returns (stream OutboundMessage);
}

// 客户端 -> 服务端
message InboundMessage {
  string id = 1;
  uint64 time = 2;
  oneof envelope {
    Connect connect = 3;
    Subscribe subscribe = 4;
    Unsubscribe unsubscribe = 5;
    Publish publish = 6;
    RpcRequest rpc_request = 7;
    SubRefresh sub_refresh = 8;
    SurveyRequest survey_request = 9;
    SurveyReply survey_reply = 10;
    Ping ping = 11;
    PresenceQuery presence_query = 12;
    Pong pong = 14;
  }
  reserved 13; // PresenceStatsQuery v1.x
}

// 服务端 -> 客户端
message OutboundMessage {
  string id = 1;
  uint64 time = 2;
  oneof envelope {
    messageloop.shared.v1.Error error = 3;
    Connected connected = 4;
    SubscribeAck subscribe_ack = 5;
    UnsubscribeAck unsubscribe_ack = 6;
    PublishAck publish_ack = 7;
    Publication publication = 8;
    RpcReply rpc_reply = 9;
    SubRefreshAck sub_refresh_ack = 10;
    SurveyRequest survey_request = 11;
    SurveyReply survey_reply = 12;
    Pong pong = 13;
    PresenceSnapshot presence = 14;
    PresenceEvent presence_event = 15;
    Ping ping = 17;
    SurveyResult survey_result = 18;
  }
  reserved 16; // PresenceStats v1.x
}

// --- 消息类型定义 ---

message Connect {
  string client_id = 1;
  string client_type = 2;
  string token = 3;
  string version = 4;
  repeated Subscription subscriptions = 5;
  string session_id = 6; // 上次会话 ID，为空表示新连接
}

message Connected {
  string session_id = 1;
  repeated Subscription subscriptions = 2;
  repeated Publication publications = 3;
  bool resumed = 4; // 是否成功恢复会话
  string epoch = 5; // broker 实例标识，用于防止重启后 offset 混淆
  bool recovered = 6;                       // 至少一个频道 recovered=true
  bool truncated = 7;                       // 至少一个频道 truncated
  repeated RecoverResult recover_results = 8;
  repeated PresenceSnapshot presence = 9;
}

// --- 恢复相关 ---

message RecoverResult {
  string channel = 1;
  bool recovered = 2;     // History 调用成功（含 0 条）
  bool truncated = 3;     // 命中 cap
  uint64 offset = 4;      // 有消息=最后一条；空批=回显 cursor
  string epoch = 5;
  messageloop.shared.v1.Error error = 6; // RECOVER_FAILED / RECOVER_SKIPPED
}

message Subscription {
  string channel = 1;
  bool ephemeral = 2;
  string token = 3;
  uint64 offset = 4; // 恢复消息的起始 offset，0 表示从最新开始
  bool recover = 5; // 是否需要恢复离线消息
  string epoch = 6; // broker epoch，用于校验 offset 有效性
}

message Subscribe {
  repeated Subscription subscriptions = 1;
}

message SubscribeAck {
  repeated Subscription subscriptions = 1;
  repeated Publication publications = 2;
  repeated RecoverResult recover_results = 3;
  string epoch = 4;
  repeated PresenceSnapshot presence = 5;
}

message Unsubscribe {
  repeated Subscription subscriptions = 1;
}

message UnsubscribeAck {
  repeated Subscription subscriptions = 1;
}

// --- 发布相关 ---

message Publish {
  string channel = 1;
  messageloop.shared.v1.Payload payload = 2;
  messageloop.shared.v1.Metadata metadata = 3;
  string token = 4;
  bool transient = 5;
  // v1.x: server ignores this in v1.0. Number frozen.
  string idempotency_key = 6;
}

message PublishAck {
  string id = 1; // 消息 ID，便于追踪
  uint64 offset = 2; // 流位置
}

message Message {
  string id = 1;
  string channel = 2;
  uint64 offset = 3;
  messageloop.shared.v1.Payload payload = 4;
  messageloop.shared.v1.Metadata metadata = 5;
}

message Publication {
  repeated Message messages = 1;
}

// --- RPC 相关 ---

message RpcRequest {
  string channel = 1;
  string method = 2;
  messageloop.shared.v1.Payload payload = 3;
  messageloop.shared.v1.Metadata metadata = 4;
}

message RpcReply {
  string request_id = 1;
  messageloop.shared.v1.Payload payload = 2;
  messageloop.shared.v1.Metadata metadata = 3;
  messageloop.shared.v1.Error error = 4;
}

// --- Survey 相关 ---

message SubRefresh {
  repeated string channels = 1;
}

message SubRefreshAck {}

message SurveyRequest {
  string request_id = 1;
  messageloop.shared.v1.Payload payload = 2;
  messageloop.shared.v1.Metadata metadata = 3;
  string channel = 4;
  int32 timeout_ms = 5;
}

message SurveyReply {
  string request_id = 1;
  messageloop.shared.v1.Payload payload = 2;
  messageloop.shared.v1.Metadata metadata = 3;
  messageloop.shared.v1.Error error = 4;
}

// 客户端 Survey 汇总。与 server.v1.SurveyResult 同名不同包。
message SurveyResult {
  string request_id = 1;
  string channel = 2;
  repeated SurveyAnswer answers = 3;
  messageloop.shared.v1.Error error = 4;
}

message SurveyAnswer {
  string session_id = 1;
  messageloop.shared.v1.Payload payload = 2;
  messageloop.shared.v1.Metadata metadata = 3;
  messageloop.shared.v1.Error error = 4;
}

// --- Presence 相关 ---

message PresenceQuery {
  string channel = 1; // 精确频道
}

message PresenceInfo {
  string session_id = 1;
  string user_id = 2;
  string client_id = 3;   // Connect.client_id（设备/端），不是 session
  int64 connected_at = 4;
}

message PresenceSnapshot {
  string channel = 1;
  repeated PresenceInfo clients = 2;
  bool truncated = 3;
  int32 occupancy = 4;
}

message PresenceEvent {
  string channel = 1;     // 始终是精确频道
  string action = 2;      // "join" | "leave"
  PresenceInfo info = 3;
  reserved 4;             // occupancy v1.x
}

// --- 心跳 ---

message Ping {}

message Pong {}
