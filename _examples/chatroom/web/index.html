<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MessageLoop ChatRoom</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
        flex-wrap: wrap;
      }
      header h1 { font-size: 16px; margin: 0 12px 0 0; }
      header label { font-size: 13px; color: #94a3b8; }
      select, input, button {
        background: #0f172a;
        color: #e2e8f0;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 13px;
      }
      button { cursor: pointer; }
      button:hover { background: #1e293b; }
      button.primary { background: #2563eb; border-color: #2563eb; }
      button.primary:hover { background: #1d4ed8; }
      button.danger { background: #dc2626; border-color: #dc2626; }
      button.danger:hover { background: #b91c1c; }
      #status { font-size: 12px; color: #94a3b8; }
      #status.online { color: #4ade80; }
      #status.offline { color: #f87171; }
      main { flex: 1; display: flex; min-height: 0; }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
      }
      .msg { line-height: 1.45; }
      .msg .meta { color: #64748b; font-size: 12px; margin-right: 8px; }
      .msg.system { color: #c084fc; font-style: italic; }
      .msg.whisper { color: #fbbf24; }
      .msg.poll { color: #38bdf8; }
      .who { color: #f472b6; font-weight: 600; margin-right: 6px; }
      #sidebar {
        width: 220px;
        border-left: 1px solid #334155;
        background: #1e293b;
        padding: 12px;
        overflow-y: auto;
      }
      #sidebar h2 { font-size: 13px; margin: 0 0 8px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
      #users { list-style: none; margin: 0; padding: 0; font-size: 13px; }
      #users li { padding: 4px 0; display: flex; align-items: center; gap: 8px; }
      #users li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
      #inputbar { display: flex; gap: 8px; padding: 10px 16px; background: #1e293b; border-top: 1px solid #334155; }
      #input { flex: 1; }
      #hint { font-size: 12px; color: #64748b; padding: 0 16px 8px; }
      #hint code { background: #1e293b; border-radius: 4px; padding: 1px 5px; }
    </style>
  </head>
  <body>
    <header>
      <h1>MessageLoop ChatRoom</h1>
      <label for="user">user</label>
      <select id="user">
        <option value="alice">alice (owner)</option>
        <option value="bob">bob</option>
        <option value="carol">carol</option>
        <option value="dave">dave</option>
        <option value="eve">eve</option>
      </select>
      <label for="room">room</label>
      <input id="room" value="chat:lobby" size="14" />
      <button id="connect" class="primary">connect</button>
      <button id="disconnect" class="danger" disabled>disconnect</button>
      <span id="status" class="offline">offline</span>
    </header>
    <main>
      <div id="messages"></div>
      <aside id="sidebar">
        <h2>online</h2>
        <ul id="users"><li>nobody yet</li></ul>
      </aside>
    </main>
    <div id="hint">
      commands: <code>/roll</code> <code>/stats</code> <code>/history</code>
      <code>/kick &lt;name&gt;</code> <code>/whoami</code> <code>/presence</code>
      <code>/poll &lt;question&gt;</code> <code>/whisper &lt;text&gt;</code>
      <code>/sys &lt;text&gt;</code> <code>/join &lt;room&gt;</code> <code>/leave &lt;room&gt;</code>
      <code>/help</code>
    </div>
    <div id="inputbar">
      <input id="input" placeholder="type a message... (Enter to send)" autocomplete="off" />
      <button id="send" class="primary">send</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
